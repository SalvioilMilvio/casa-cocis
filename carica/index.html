<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d5c">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Inserimento dati</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<link rel="stylesheet" href="../style.css">
<style>
.carica{max-width:480px; margin:20px auto; display:grid; gap:14px}
.scheda{background:var(--card); border-radius:var(--r); box-shadow:var(--sh); padding:18px}
.scheda h2{font-size:19px; margin-bottom:6px}
.scheda label{display:block; font-size:14px; color:var(--mut); margin:12px 0 4px}
.scheda input,.scheda select{width:100%; font:inherit; font-size:18px; padding:10px; color:var(--ink);
  background:var(--bg); border:1px solid var(--line); border-radius:10px}
.bott{display:block; width:100%; text-align:center; font:inherit; font-weight:600; padding:13px; margin-top:14px;
  border:0; border-radius:10px; background:var(--blu2); color:#fff; cursor:pointer}
.bott:disabled{opacity:.5}
.msg{padding:10px 12px; border-radius:10px; font-size:15px; margin-top:12px}
.msg.ok{background:var(--okbg); color:var(--ok)}
.msg.warn{background:var(--warnbg); color:var(--warn)}
.msg.bad{background:var(--badbg); color:var(--bad)}
[hidden]{display:none !important}
</style>
</head>
<body>
<main class="wrap carica">
  <section class="scheda" id="scheda">
    <h2 id="titolo">Lettura contatore</h2>
    <p id="ultima" style="margin:0;color:var(--mut)"></p>

    <div id="scelta" hidden>
      <label for="contatore">Contatore</label>
      <select id="contatore"></select>
    </div>

    <label for="lettura">Metri cubi (solo numeri interi)</label>
    <input id="lettura" type="number" inputmode="numeric" min="0" step="1">
    <label for="data">Data della lettura</label>
    <input id="data" type="date">

    <button class="bott" id="salva">Salva la lettura</button>
    <div id="msg" class="msg" hidden></div>
  </section>
</main>

<script>
const SERVIZIO = 'https://casa-cocis-letture.casa-cocis.workers.dev';
// Il link personale si apre una volta: poi il bottone della dashboard basta su questo dispositivo.
let token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
try {
  if (token) localStorage.setItem('cocis-token', token);
  else token = localStorage.getItem('cocis-token') || '';
} catch (e) {}
const $ = id => document.getElementById(id);
let contatore = null, conferma = false;

function avvisa(testo, tipo) {
  $('msg').hidden = !testo;
  $('msg').textContent = testo || '';
  $('msg').className = 'msg ' + (tipo || 'ok');
}

async function chiama(azione, corpo) {
  const r = await fetch(SERVIZIO + azione, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, contatore, ...corpo }),
  });
  const j = await r.json();
  if (j.errore) throw new Error(j.errore);
  return j;
}

function blocca(testo) {
  avvisa(testo, 'bad');
  for (const id of ['lettura', 'data', 'salva']) $(id).disabled = true;
}

async function chi() {
  const c = await chiama('/chi', {});
  contatore = c.contatore;
  $('titolo').textContent = c.nome;
  const u = c.ultima;
  $('ultima').textContent = u ? `Ultima lettura: ${u.lettura} mc del ${u.data.split('-').reverse().join('/')}` : '';
  if (c.tutti) {
    $('scelta').hidden = false;
    if (!$('contatore').options.length) {
      $('contatore').innerHTML = c.tutti.map(x => `<option value="${x.id}">${x.nome}</option>`).join('');
    }
    $('contatore').value = contatore;
  }
}

$('contatore').addEventListener('change', async e => {
  contatore = e.target.value;
  avvisa('');
  await chi().catch(err => avvisa(err.message, 'bad'));
});

$('lettura').addEventListener('input', () => { conferma = false; });

$('salva').addEventListener('click', async () => {
  const lettura = Number($('lettura').value);
  if (!$('lettura').value || !Number.isInteger(lettura)) { avvisa('Scrivi i metri cubi, senza decimali.', 'warn'); return; }
  $('salva').disabled = true;
  try {
    const r = await chiama('/salva', { data: $('data').value, lettura, conferma });
    if (r.avviso) {
      conferma = true;
      avvisa(r.avviso + ' Se è giusto, premi di nuovo Salva.', 'warn');
    } else {
      conferma = false;
      await chi();
      const a = r.allarme;
      const dett = a ? ` ${String(a.mcg).replace('.', ',')} mc al giorno negli ultimi ${a.giorni} giorni.` : '';
      if (a && a.livello === 'bad') avvisa('Salvata, ma ATTENZIONE: consumo oltre la soglia rossa.' + dett + ' Controlla che non ci siano perdite.', 'bad');
      else if (a && a.livello === 'warn') avvisa('Salvata. Consumo sopra la soglia gialla.' + dett, 'warn');
      else avvisa('Salvata. Consumo nella norma.' + dett + ' La dashboard si aggiorna in un paio di minuti.', 'ok');
    }
  } catch (err) {
    avvisa(err.message, 'bad');
  } finally {
    $('salva').disabled = false;
  }
});

$('data').value = new Date().toLocaleDateString('sv');
$('data').max = $('data').value;
if (!SERVIZIO) blocca('Il servizio di caricamento non è ancora attivo.');
else if (!token) blocca('Apri questa pagina dal tuo link personale.');
else chi().catch(err => blocca(err.message));
</script>
</body>
</html>
